# Pulizia dei file del vecchio sito rimasti su Aruba. Approvata da Francesco il 12/10/2026 sulla scheda
# "Tolgo dal server questi 45 file del vecchio sito?" (risposta: "Sì, toglili").
# Toglie SOLO i 45 file elencati qui sotto: tutti del vecchio sito e non usati dal nuovo.
# Copie di sicurezza: 43 file sono nel branch backup-sito-2026-09-25; i due video vengono salvati
# prima nel branch backup-video-vecchio-sito, e se il salvataggio non riesce non si cancella nulla.
# Non tocca app/, buzz-api/, cgi-bin/ né i file del nuovo sito. Gira solo sul branch di lavoro, mai su main.
name: Pulizia vecchi file su Aruba

on:
  push:
    branches: [claude/project-thread-ipchkf]
    paths: [.github/workflows/pulizia-server.yml]

jobs:
  pulizia:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      LFTP_SET: "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; set net:timeout 20;"
    steps:
      - name: Installa lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Copia di sicurezza dei due video vecchi
        run: |
          mkdir video && cd video
          lftp -u "14953727@aruba.it,$FTP_PASSWORD" ftplnx02.aruba.it -e "$LFTP_SET
            get /www.buzzstudio.it/media/cases/buzz-signal-teaser.mp4 -o buzz-signal-teaser.mp4;
            get /www.buzzstudio.it/media/influencer/campania-food-blog.mp4 -o campania-food-blog.mp4;
            bye"
          ls -l
          test "$(stat -c %s buzz-signal-teaser.mp4)" = 2007095
          test "$(stat -c %s campania-food-blog.mp4)" = 16966000
          git init -q -b backup-video-vecchio-sito
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Video del vecchio sito tolti da Aruba il $(date +%d/%m/%Y)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" backup-video-vecchio-sito
      - name: Togli i 45 file vecchi dal server
        run: |
          lftp -u "14953727@aruba.it,$FTP_PASSWORD" ftplnx02.aruba.it -e "$LFTP_SET
            rm "/www.buzzstudio.it/_motion/buzz.02ffacad07cf.js";
            rm "/www.buzzstudio.it/_motion/buzz.1448fcb993e2.js";
            rm "/www.buzzstudio.it/_motion/buzz.53e05393f85f.js";
            rm "/www.buzzstudio.it/_motion/buzz.61616086aa06.js";
            rm "/www.buzzstudio.it/_motion/buzz.baedd926b051.js";
            rm "/www.buzzstudio.it/_motion/buzz.e604df256a1d.js";
            rm "/www.buzzstudio.it/_motion/buzz.eaf279a0e746.js";
            rm "/www.buzzstudio.it/_motion/careers.1dee5debaaa6.js";
            rm "/www.buzzstudio.it/_motion/influencer.0dc7ca55acf5.js";
            rm "/www.buzzstudio.it/_motion/volume.2600bc66442b.js";
            rm "/www.buzzstudio.it/_motion/volume.68845bc15d65.js";
            rm "/www.buzzstudio.it/_next/static/css/index.B8dyoaA3.css";
            rm "/www.buzzstudio.it/_next/static/css/index.BU4A1RnE.css";
            rm "/www.buzzstudio.it/_next/static/css/index.BkynqHsA.css";
            rm "/www.buzzstudio.it/_next/static/css/index.Bxzc9mGC.css";
            rm "/www.buzzstudio.it/_next/static/css/index.Dmgti0rf.css";
            rm "/www.buzzstudio.it/_next/static/css/index.eCXk1Kzf.css";
            rm "/www.buzzstudio.it/_next/static/css/index.uD4HOaF3.css";
            rm "/www.buzzstudio.it/_next/static/css/index.yCMdw5LB.css";
            rm "/www.buzzstudio.it/_next/static/css/page.B8r_3XU7.css";
            rm "/www.buzzstudio.it/_next/static/css/page.BOPkjQEd.css";
            rm "/www.buzzstudio.it/_next/static/css/page.BpPNRXFd.css";
            rm "/www.buzzstudio.it/_next/static/css/page.BxNYvjCl.css";
            rm "/www.buzzstudio.it/_next/static/css/page.C4jHbqKo.css";
            rm "/www.buzzstudio.it/_next/static/css/page.CXvZD4dE.css";
            rm "/www.buzzstudio.it/_next/static/css/page.CszCn9u4.css";
            rm "/www.buzzstudio.it/_next/static/css/page.CyupIlfp.css";
            rm "/www.buzzstudio.it/_next/static/css/page.D6YcYk-H.css";
            rm "/www.buzzstudio.it/_next/static/css/page.Dbb-QoPz.css";
            rm "/www.buzzstudio.it/_next/static/css/page.byo5ju3t.css";
            rm "/www.buzzstudio.it/_next/static/css/page.fhJKh6XD.css";
            rm "/www.buzzstudio.it/_next/static/css/page.uxLR8Osj.css";
            rm "/www.buzzstudio.it/brand/campania-food-blog.png";
            rm "/www.buzzstudio.it/contact.js";
            rm "/www.buzzstudio.it/fonts/Anybody-ExtraExpanded-Black.ttf";
            rm "/www.buzzstudio.it/fonts/Anybody-ExtraExpanded-Black.woff2";
            rm "/www.buzzstudio.it/fonts/Anybody-Variable.ttf";
            rm "/www.buzzstudio.it/media/cases/buzz-signal-poster.webp";
            rm "/www.buzzstudio.it/media/influencer/.htaccess";
            rm "/www.buzzstudio.it/media/influencer/poster.webp";
            rm "/www.buzzstudio.it/portfolio.js";
            rm "/www.buzzstudio.it/privacy.html";
            rm "/www.buzzstudio.it/ver.php";
            rm "/www.buzzstudio.it/media/cases/buzz-signal-teaser.mp4";
            rm "/www.buzzstudio.it/media/influencer/campania-food-blog.mp4";
            rmdir /www.buzzstudio.it/_next/static/css;
            rmdir /www.buzzstudio.it/_next/static;
            rmdir /www.buzzstudio.it/_next;
            rmdir /www.buzzstudio.it/_motion;
            rmdir /www.buzzstudio.it/media/influencer;
            bye" || true
      - name: Elenco dopo la pulizia
        run: |
          lftp -u "14953727@aruba.it,$FTP_PASSWORD" ftplnx02.aruba.it -e "$LFTP_SET cls -la /www.buzzstudio.it/; bye"
          for d in brand fonts media privacy assets; do
            lftp -u "14953727@aruba.it,$FTP_PASSWORD" ftplnx02.aruba.it -e "$LFTP_SET find -l /www.buzzstudio.it/$d/; bye" || true
          done
